# Keep the package manifest/lockfile and CI actions current each week.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    ignore:
      - dependency-name: "@kontourai/surface"
        update-types: ["version-update:semver-major"]
      - dependency-name: "hachure"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
